<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://summerofcode.withgoogle.com/assets/media/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSoC Organizations Pro | Explore & Analyze Google Summer of Code Orgs (2016-2026)</title>
    <meta name="description" content="Explore, search, filter and analyze all 519 organizations participating in Google Summer of Code from 2016 to 2026 with student project archives, tech stack insights, and consistency scores." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Theme Script (Dark mode by default) -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('gsoc_theme_preference');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
